<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EarthScape Climate Agency{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="{{ url_for('static', filename='vendor/lucide.min.js') }}"></script>
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const theme = saved || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header class="site-header public-header">
    <div class="header-row">
      <a href="{{ url_for('public.index') }}" class="brand">
        <span class="brand-mark"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="EarthScape logo"></span>
        <span class="brand-text">EarthScape</span>
      </a>

      <div class="header-actions" style="margin-left: auto;">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <i data-lucide="sun-medium" class="icon-sun"></i>
          <i data-lucide="moon" class="icon-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="fade-in">
    {% block content %}{% endblock %}
  </main>

  <script>
    lucide.createIcons();

    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
